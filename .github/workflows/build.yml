name: Build patched Plasma

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Only the public repository's trusted main branch may build with cache credentials.
# Each needs edge includes cachix-action's post step, which drains daemon uploads
# before the next runner attempts to substitute the preceding package's outputs.
jobs:
  kwin:
    if: &trusted-main github.repository == 'Gandhuttt/plasma-patches' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PACKAGE: kwin
    steps: &build-steps
      - name: Check cache credentials
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$CACHIX_AUTH_TOKEN" ]]; then
            echo '::error::Set the CACHIX_AUTH_TOKEN repository secret before building.'
            exit 1
          fi

      - name: Check out trusted revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Reclaim hosted-runner SDK space
        shell: bash
        run: |
          # Never run this cleanup on a workstation or self-hosted runner.
          [[ "$GITHUB_ACTIONS" == true && "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux ]]
          df -h / /mnt
          # Preinstalled Android, .NET, Haskell, Swift and language SDK caches;
          # none are used by sandboxed Nix builds or the runner's bundled Node.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet \
            /usr/local/.ghcup /usr/local/swift /opt/hostedtoolcache
          # The configured sandbox bind must exist before any Nix build runs.
          sudo install -d -m 0755 /var/cache/plasma-ccache
          df -h / /mnt

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          enable_kvm: false
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 1
            cores = 4
            keep-outputs = false
            keep-derivations = false
            extra-sandbox-paths = /var/cache/plasma-ccache

      - name: Prepare native headless rendering
        if: env.PACKAGE == 'kwin'
        shell: bash
        run: |
          # KWin's supported software EGL device allocates buffers via udmabuf.
          # This is the disposable hosted runner, never the user's workstation.
          [[ "$GITHUB_ACTIONS" == true && "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux ]]
          sudo modprobe udmabuf
          sudo udevadm settle
          test -c /dev/udmabuf
          sudo chgrp nixbld /dev/udmabuf
          sudo chmod 0660 /dev/udmabuf

      - name: Configure incremental Cachix uploads
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: gandhuttt-plasma
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: true
          cachixArgs: -j2
          # Builders also produce unrequested outputs: don't upload debug symbols
          # or Qt Designer plugins. Cachix already excludes cache.nixos.org paths.
          # The free public 5 GB cache uses LRU eviction; keep runtime/dev outputs.
          pushFilter: '-(debug|devtools)$'

      - name: Build with isolated persistent compiler objects
        uses: ./.github/actions/build-plasma
        with:
          package: ${{ env.PACKAGE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

  workspace:
    needs: kwin
    if: *trusted-main
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PACKAGE: plasma-workspace
    steps: *build-steps

  # Desktop builds plasma-pa as a dependency. Build it in its own cache job
  # first, otherwise its compiler objects are discarded with Desktop's runner.
  audio:
    needs: workspace
    if: *trusted-main
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PACKAGE: plasma-pa
    steps: *build-steps

  desktop:
    needs: audio
    if: *trusted-main
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PACKAGE: plasma-desktop
    steps: *build-steps

  remaining:
    needs: desktop
    if: *trusted-main
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        # Give each remaining package its own runner/cache so concurrent jobs
        # cannot overwrite snapshots; plasma-pa was handled before Desktop.
        package:
          - kdeplasma-addons
          - bluedevil
          - kinfocenter
          - plasma-browser-integration
          - plasma-login-manager
          - plasma-setup
          - powerdevil
          - print-manager
          - xdg-desktop-portal-kde
    env:
      PACKAGE: ${{ matrix.package }}
    steps: *build-steps
